name: Fetch Google ADK runtime bundle

on:
  push:
    branches:
      - automation/adk-package-fetch-20260816
    paths:
      - .github/workflows/fetch-adk-runtime.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build isolated Google ADK runtime directory
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --target adk_site "google-adk==2.6.3"
          python - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path('adk_site').resolve()))
          from google.adk.agents import LlmAgent, ParallelAgent, SequentialAgent
          from google.adk.runners import Runner
          from google.adk.sessions import InMemorySessionService

          version = importlib.metadata.version('google-adk')
          assert version == '2.6.3', version
          print('google-adk', version)
          print(LlmAgent.__module__, SequentialAgent.__module__, ParallelAgent.__module__)
          print(Runner.__module__, InMemorySessionService.__module__)
          pathlib.Path('adk_site/ADK_RUNTIME_BUILD.txt').write_text(
              'google-adk=2.6.3\npython=3.13\nplatform=ubuntu-latest x86_64\n',
              encoding='utf-8',
          )
          PY

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: google-adk-2.6.3-py313-linux-x86_64-site-packages
          path: adk_site
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
